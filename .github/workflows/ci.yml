name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Icon Composer `.icon` assets require Xcode 26 or newer.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache DoH gateway Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Native/DoHGateway

      - name: Install dependencies and generate workspace
        run: |
          mise x -- tuist install
          mise x -- tuist generate --no-open

      - name: Validate source privacy manifest
        run: |
          plutil -lint dexo/PrivacyInfo.xcprivacy
          plutil -convert json -o /tmp/privacy.json dexo/PrivacyInfo.xcprivacy
          jq -e '
            .NSPrivacyTracking == false and
            any(.NSPrivacyAccessedAPITypes[];
              .NSPrivacyAccessedAPIType == "NSPrivacyAccessedAPICategoryUserDefaults" and
              (.NSPrivacyAccessedAPITypeReasons | index("CA92.1") != null)
            ) and
            any(.NSPrivacyAccessedAPITypes[];
              .NSPrivacyAccessedAPIType == "NSPrivacyAccessedAPICategorySystemBootTime" and
              (.NSPrivacyAccessedAPITypeReasons | index("35F9.1") != null)
            )
          ' /tmp/privacy.json

      - name: Test CookedHTML
        working-directory: Packages/CookedHTML
        run: swift test

      - name: Test DoH gateway policy
        working-directory: Packages/DoHGatewayPolicy
        run: swift test

      - name: Test DoH gateway (Rust)
        working-directory: Native/DoHGateway
        run: cargo test

      - name: Build iOS DoH gateway static library
        run: |
          command -v cmake >/dev/null || brew install cmake
          brew list llvm >/dev/null 2>&1 || brew install llvm
          chmod +x scripts/build-doh-gateway.sh
          ./scripts/build-doh-gateway.sh

      - name: Build app without signing
        run: |
          xcodebuild build \
            -workspace dexo.xcworkspace \
            -scheme dexo \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -quiet \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=''

      - name: Validate bundled privacy manifest
        run: |
          manifest=build/DerivedData/Build/Products/Debug-iphoneos/dexo.app/PrivacyInfo.xcprivacy
          test -f "$manifest"
          plutil -lint "$manifest"
          cmp dexo/PrivacyInfo.xcprivacy "$manifest"

      # Unsigned Debug IPA for PR sideloading. Push to main still uses
      # build-ipa.yml (Release archive + GitHub Release).
      - name: Package unsigned Debug IPA
        if: github.event_name == 'pull_request'
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphoneos/dexo.app"
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -r dexo-unsigned-debug.ipa Payload
          echo "Unsigned Debug IPA: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "### Unsigned Debug IPA" >> "$GITHUB_STEP_SUMMARY"
          echo "Download \`dexo-unsigned-debug.ipa\` from this run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned Debug IPA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dexo-unsigned-debug
          path: build/dexo-unsigned-debug.ipa
          retention-days: 7
          if-no-files-found: error
