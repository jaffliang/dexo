name: Build Unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - 'TestFlight/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache DoH gateway Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Native/DoHGateway

      - name: Generate Xcode project
        run: mise x -- tuist install && mise x -- tuist generate

      - name: Build iOS DoH gateway static library
        run: |
          command -v cmake >/dev/null || brew install cmake
          chmod +x scripts/build-doh-gateway.sh
          ./scripts/build-doh-gateway.sh

      - name: Set build number
        id: buildnumber
        run: echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -workspace dexo.xcworkspace \
            -scheme dexo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/dexo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ steps.buildnumber.outputs.build }} | xcpretty

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/dexo.xcarchive/Products/Applications/dexo.app build/Payload/
          cd build && zip -r dexo-unsigned.ipa Payload

      - name: Read version
        id: version
        run: |
          VERSION=$(awk -F'"' '/"MARKETING_VERSION":/ { print $4; exit }' Project.swift)
          test -n "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD="${{ steps.buildnumber.outputs.build }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}-build.$(printf '%03d' "$BUILD")"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" build/dexo-unsigned.ipa \
            --title "Dexo ${VERSION} (${BUILD})" \
            --generate-notes \
            --latest
